name: Deploy
 
on:
  # Erst nur manuell starten (Actions -> Deploy -> Run workflow).
  # Wenn alles klappt, die zwei auskommentierten Zeilen aktivieren.
  workflow_dispatch:
  # push:
  #   branches: [main]
 
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
 
      - run: npm ci
      - run: npm run build
 
      - name: SSH vorbereiten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
 
      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          REL=$(date +%Y%m%d%H%M%S)
          BASE=/var/www/r3webdesign
          HOST=deploy@$SSH_HOST
          rsync -az dist/ "$HOST:$BASE/releases/$REL/"
          ssh "$HOST" "ln -sfn $BASE/releases/$REL $BASE/current.tmp && mv -Tf $BASE/current.tmp $BASE/current && cd $BASE/releases && ls -1t | tail -n +6 | xargs -r rm -rf"
 
